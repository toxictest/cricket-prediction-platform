<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cricket Prediction Community">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="#09090b"/>
  <rect x="1" y="1" width="62" height="62" rx="11.5" fill="none" stroke="#ef4444" stroke-opacity="0.45"/>

  <!-- terminal caret -->
  <path d="M15 22l9 7-9 7" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M29 38h16" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

  <!-- cricket ball seam accent -->
  <circle cx="47" cy="20" r="7" fill="none" stroke="#ef4444" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M42 20h10" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.6 1.8"/>
</svg>
